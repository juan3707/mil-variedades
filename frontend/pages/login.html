<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión | Mil Variedades</title>
  <meta name="description" content="Acceso administrativo de Mil Variedades." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="login-body">

  <main class="login-wrap">
    <div class="login-card">
    <a href="index.html" class="logo login-logo">
  <span class="logo-icono">
    <img src="../assets/img/LOGO_MINIMALISTA.jpg" alt="Mil Variedades" class="logo-img">
  </span>
  <span class="logo-texto">
    <h1>Mil Variedades</h1>
    <span>La Ceja</span>
  </span>
</a>

      <h2 class="login-titulo">Iniciar sesión</h2>
      <p class="login-subtitulo">Acceso exclusivo para Administradores y Super Administradores.</p>

      <form id="form-login" class="login-form" novalidate>
        <div class="login-campo">
          <label for="input-correo">Correo electrónico</label>
          <input type="email" id="input-correo" name="correo" autocomplete="username" required />
        </div>

        <div class="login-campo">
          <label for="input-contrasena">Contraseña</label>
          <input type="password" id="input-contrasena" name="contrasena" autocomplete="current-password" required />
        </div>

        <p class="login-error" id="login-error" role="alert" style="display:none;"></p>

        <button type="submit" class="btn-primario login-btn" id="btn-login">
          <span id="btn-login-texto">Iniciar sesión</span>
        </button>
      </form>

      <a href="index.html" class="login-volver"><i class="fa-solid fa-arrow-left"></i> Volver al sitio</a>
    </div>
  </main>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
